name: Build spirv_harness (Android ARM64 NativeAOT)

on:
  workflow_dispatch:
  push:
    branches: [feat/android-port]
    paths:
      - '.github/workflows/android-harness.yml'
      - 'tools/maxwell/spirv_harness/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch Ryubing shader translator source
        run: |
          mkdir -p private/third_party/ryubing
          curl -fsSL https://codeberg.org/Software_arch/Ryubing/archive/a82350bb77.tar.gz \
            | tar -xz -C private/third_party/ryubing --strip-components=1

      - name: Setup Zig 0.14.0 + static libz.a (aarch64-linux-musl)
        run: |
          curl -fsSL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            | tar -xJ -C /tmp
          curl -fsSL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz | tar -xz -C /tmp
          mkdir -p /tmp/zlib-out /tmp/zig-wrap
          ZIG=/tmp/zig-linux-x86_64-0.14.0/zig
          (cd /tmp/zlib-1.3.1 && CC="$ZIG cc -target aarch64-linux-musl -O2" AR="$ZIG ar" RANLIB="$ZIG ranlib" ./configure --static && make -j4 libz.a)
          cp /tmp/zlib-1.3.1/libz.a /tmp/zlib-out/libz.a

          cat << 'EOF' > /tmp/zig-wrap/clang
          #!/bin/bash
          has_c=0
          args=()
          for a in "$@"; do
            case "$a" in
              -c|--version) has_c=1; args+=("$a") ;;
              -pie|-Wl,-pie|-rdynamic|-Wl,--export-dynamic|-Wl,-Bdynamic|-fuse-ld=*|-Wl,--gc-sections|--gc-sections) ;;
              *) args+=("$a") ;;
            esac
          done
          if [ "$has_c" -eq 0 ]; then
            exec /tmp/zig-linux-x86_64-0.14.0/zig cc -target aarch64-linux-musl -static -L/tmp/zlib-out "${args[@]}"
          else
            exec /tmp/zig-linux-x86_64-0.14.0/zig cc -target aarch64-linux-musl "${args[@]}"
          fi
          EOF
          cat << 'EOF' > /tmp/zig-wrap/objcopy
          #!/bin/sh
          exec /tmp/zig-linux-x86_64-0.14.0/zig objcopy "$@"
          EOF
          chmod +x /tmp/zig-wrap/clang /tmp/zig-wrap/objcopy
          echo "/tmp/zig-wrap" >> "$GITHUB_PATH"

      - name: Publish spirv_harness NativeAOT (static linux-musl-arm64)
        run: |
          dotnet publish tools/maxwell/spirv_harness/SpirvHarness.csproj \
            -c Release \
            -r linux-musl-arm64 \
            -p:PublishAot=true \
            -p:StripSymbols=false \
            -o out/spirv_harness
          file out/spirv_harness/spirv_harness
          ls -lh out/spirv_harness/spirv_harness

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spirv_harness-android-arm64
          path: out/spirv_harness/spirv_harness
          retention-days: 30
